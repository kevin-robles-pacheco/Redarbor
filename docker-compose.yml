services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/Inventory.Infrastructure/Persistence/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=inventory;Username=inventory;Password=local-dev-only
      OAUTH_CLIENT_ID: inventory-api
      OAUTH_CLIENT_SECRET: local-dev-only
      JWT_SIGNING_KEY: local-dev-only-signing-key-32-bytes
      JWT_ISSUER: inventory-api
      JWT_AUDIENCE: inventory-api
      JWT_EXPIRES_IN_SECONDS: "3600"
      RATE_LIMIT_PERMIT_LIMIT: "100"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      OAUTH_RATE_LIMIT_PERMIT_LIMIT: "10"
    ports:
      - "8088:8080"
volumes:
  postgres-data:
